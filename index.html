async function copy(text){
try{ await navigator.clipboard.writeText(text); toast('복사했어요'); }
catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('복사했어요'); }catch(_){ toast('복사가 안 돼요'); } ta.remove(); }
}
/* ---------- 오디오 ---------- */
let actx = null, micStream = null, playing = null;
async function audio(){
if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
if(actx.state === 'suspended') await actx.resume();
return actx;
}
const refCache = {};
async function getRef(snd){
if(!refCache[snd.id]){
refCache[snd.id] = (async () => {
const buf = await M.render(snd, 44100);
const feat = M.analyze(await M.toAnalysis(buf));
return { buf, feat };
})();
}
return refCache[snd.id];
}
async function playRef(snd){
const ctx = await audio(); const { buf } = await getRef(snd);
if(playing){ try{ playing.stop(); }catch(e){} }
const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.start(); playing = s;
return new Promise(r => s.onended = () => { if(playing === s) playing = null; r(); });
}
function beep(f, d, when){
const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
const t = actx.currentTime + (when||0); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t+0.01); g.gain.linearRampToValueAtTime(0, t+d);
o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+0.02);
}
function fanfare(score){
const notes = score >= 90 ? [523,659,784,1047,1319] : score >= 70 ? [523,659,784,1047] : score >= 45 ? [523,587,659] : [392,370,349];
notes.forEach((f,i) => beep(f, 0.16, i*0.11));
}
async function getMic(){
if(micStream && micStream.active) return micStream;
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomic');
micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
return micStream;
}
function record(seconds, onTick, abortRef){
return new Promise(resolve => {
const ctx = actx, src = ctx.createMediaStreamSource(micStream);
const proc = ctx.createScriptProcessor(2048, 1, 1), mute = ctx.createGain(); mute.gain.value = 0;
const chunks = []; const t0 = ctx.currentTime;
proc.onaudioprocess = e => {
const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
let pk = 0; for(let i=0;i<d.length;i+=4) pk = Math.max(pk, Math.abs(d[i]));
const el = ctx.currentTime - t0; onTick && onTick(pk, el / seconds);
if(el >= seconds || abortRef.stop) finish();
};
let done = false;
function finish(){
if(done) return; done = true;
proc.onaudioprocess = null; try{ src.disconnect(); proc.disconnect(); mute.disconnect(); }catch(e){}
const len = chunks.reduce((s,c) => s + c.length, 0);
const buf = ctx.createBuffer(1, Math.max(1,len), ctx.sampleRate); const ch = buf.getChannelData(0);
let o = 0; for(const c of chunks){ ch.set(c, o); o += c.length; }
resolve(buf);
}
src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
});
}
/* ---------- 채점 문구 ---------- */
function grade(s){
if(s >= 95) return ['복붙 수준', '원본이랑 구분이 안 돼요. 혹시 스피커 갖다 댔어요?'];
if(s >= 85) return ['성대 장인', '이 정도면 개인기로 써도 됩니다.'];
if(s >= 72) return ['꽤 닮았어요', '친구들이 바로 알아들을 수준이에요.'];
if(s >= 55) return ['느낌은 있어요', '방향은 맞아요. 높낮이를 조금 더 과감하게!'];
if(s >= 35) return ['누구세요?', '뭔가를 흉내 내긴 했는데… 다시 들어볼까요?'];
return ['다른 생물', '이건 새로운 종의 울음소리예요.'];
}
function tip(parts){
const k = Object.entries(parts).sort((a,b) => a[1]-b[1])[0][0];
return { pitch:'음높이 흐름을 더 따라가 보세요. 올라가고 내려가는 지점이 중요해요.', timbre:'목소리 색깔을 바꿔보세요. 코맹맹이, 휘파람, 굵은 소리 등.', rhythm:'끊고 이어지는 박자를 맞춰보세요.', length:'전체 길이를 원본에 맞춰보세요.' }[k];
}
const PART_NAMES = { pitch:'음높이', timbre:'음색', rhythm:'리듬', length:'길이' };
/* ---------- 스테이지 (두 모드 공용) ---------- */
function makeStage(root, opts){
root.innerHTML = `
<div class="stage">
<div>
<div class="screen">
<div class="top"><span class="lvl"></span><span class="dur"></span></div>
<div class="word"></div>
<div class="nm"></div>
<div class="hint"></div>
<div class="turn" hidden></div>
<div class="meter"><div class="bar"><i></i></div><div class="time"><i></i></div></div>
<div class="status">원본을 듣고 따라해 보세요</div>
<div class="count" hidden></div>
</div>
<div class="btns">
<button class="btn b-listen">▶ 원본 듣기</button>
<button class="btn primary b-rec">● 따라하기</button>
<button class="btn b-stop" hidden>■ 녹음 끝</button>
</div>
</div>
<div class="result"></div>
</div>`;
const q = s => root.querySelector(s);
const st = { snd:null, busy:false, abort:{} };
const setStatus = (t, rec) => { const e = q('.status'); e.textContent = t; e.classList.toggle('rec', !!rec); };
function setSound(snd, turn){
st.snd = snd;
q('.lvl').innerHTML = '난이도 <span class="dots">' + '●'.repeat(snd.lv) + '<span style="opacity:.3">' + '●'.repeat(3-snd.lv) + '</span></span>';
q('.dur').textContent = snd.dur.toFixed(1) + '초';
q('.word').textContent = snd.word;
q('.nm').textContent = snd.name;
q('.hint').textContent = '팁: ' + snd.hint;
const t = q('.turn'); t.hidden = !turn; if(turn) t.textContent = turn + ' 차례';
q('.bar i').style.width = '0'; q('.time i').style.width = '0';
setStatus('원본을 듣고 따라해 보세요');
showEmpty(opts.emptyText);
getRef(snd);
}
function showEmpty(html){ q('.result').innerHTML = `<div class="empty">${html || '<strong>점수는 여기에</strong>원본 듣기 → 따라하기를 누르면<br>3, 2, 1 후 녹음이 시작돼요.'}</div>`; }
function lock(on){ st.busy = on; q('.b-listen').disabled = on; q('.b-rec').disabled = on || st.recDisabled; }
q('.b-listen').onclick = async () => { if(st.busy || !st.snd) return; lock(true); setStatus('재생 중…'); await playRef(st.snd); setStatus('이제 따라해 보세요'); lock(false); };
q('.b-stop').onclick = () => { st.abort.stop = true; };
q('.b-rec').onclick = async () => {
if(st.busy || !st.snd) return;
lock(true);
try{
await audio();
try{ await getMic(); }
catch(e){
setStatus('마이크를 쓸 수 없어요', true);
showEmpty('<strong>마이크 권한이 필요해요</strong>주소창 옆 자물쇠(또는 설정)에서 이 사이트의 마이크를 허용한 뒤 다시 눌러주세요.' + (window.isSecureContext ? '' : '<br>https 주소에서만 마이크가 동작해요.'));
lock(false); return;
}
const ref = await getRef(st.snd);
const cnt = q('.count'); cnt.hidden = false;
for(const n of [3,2,1]){ cnt.textContent = n; beep(n === 1 ? 880 : 660, 0.12); await sleep(700); }
cnt.hidden = true;
setStatus('녹음 중… 지금 따라하세요!', true);
q('.b-stop').hidden = false;
st.abort = {};
const secs = st.snd.dur + 1.0;
const buf = await record(secs, (pk, p) => { q('.bar i').style.width = Math.min(100, pk*160) + '%'; q('.time i').style.width = Math.min(100, p*100) + '%'; }, st.abort);
q('.b-stop').hidden = true; q('.bar i').style.width = '0';
setStatus('분석 중…');
await sleep(30);
const U = M.analyze(await M.toAnalysis(buf));
const res = M.compare(ref.feat, U);
res.R = ref.feat; res.U = U;
if(res.silent){
setStatus('소리가 거의 안 들렸어요', true);
showEmpty('<strong>소리가 안 잡혔어요</strong>마이크에 조금 더 가까이, 크게 해보세요.');
opts.onSilent && opts.onSilent();
}else{
setStatus('채점 완료!');
fanfare(res.score);
showResult(res);
opts.onResult && opts.onResult(res, st.snd);
}
}finally{ q('.b-stop').hidden = true; lock(false); }
};
function showResult(res){
const [g, c] = grade(res.score);
const el = q('.result');
el.innerHTML = `
<div class="score"><span class="n">0</span><span class="u">점</span></div>
<div class="grade">${esc(g)}</div>
<div class="cmt">${esc(c)}</div>
<div class="parts">${Object.entries(res.parts).map(([k,v]) => `<div class="part"><span>${PART_NAMES[k]}</span><span class="t"><i style="width:${Math.round(v*100)}%"></i></span><b>${Math.round(v*100)}</b></div>`).join('')}</div>
<canvas class="viz" width="600" height="160"></canvas>
<div class="legend"><span style="--c:var(--cyan)">원본 음높이</span><span style="--c:var(--pink)">내 음높이</span><span style="--c:#3a3f8f">음량</span></div>
${res.score < 95 ? `<div class="note">${esc(tip(res.parts))}</div>` : ''}
<div class="btns extra"></div>`;
const n = el.querySelector('.n'), target = res.score, t0 = performance.now();
(function tick(t){ const p = Math.min(1, (t - t0) / 900); n.textContent = Math.round(target * (1 - Math.pow(1-p, 3))); if(p < 1) requestAnimationFrame(tick); })(t0);
drawViz(el.querySelector('canvas'), res.R, res.U);
if(window.matchMedia('(max-width:820px)').matches) el.scrollIntoView({ behavior:'smooth', block:'start' });
opts.extraButtons && opts.extraButtons(el.querySelector('.extra'), res);
}
return { setSound, setStatus, showEmpty, q, st, setRecDisabled(v){ st.recDisabled = v; q('.b-rec').disabled = v || st.busy; } };
}
function drawViz(cv, R, U){
const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 600, h = cv.clientHeight || 120;
cv.width = w * dpr; cv.height = h * dpr;
const g = cv.getContext('2d'); g.scale(dpr, dpr);
const css = getComputedStyle(document.documentElement);
const cyan = css.getPropertyValue('--cyan').trim(), pink = css.getPropertyValue('--pink').trim();
g.fillStyle = 'rgba(80,88,190,.35)';
R.e.forEach((e, i) => { const x = i / (R.n-1) * w, bh = (e + 40) / 40 * h * 0.45; g.fillRect(x, h - bh, Math.max(1, w / R.n), bh); });
g.fillStyle = 'rgba(255,95,162,.18)';
U.e.forEach((e, i) => { const x = i / (U.n-1) * w, bh = (e + 40) / 40 * h * 0.45; g.fillRect(x, h - bh, Math.max(1, w / U.n), bh); });
const all = [...R.st.map(v => v - R.med), ...U.st.map(v => v - U.med)].filter(v => v === v);
const lo = Math.min(-6, ...all), hi = Math.max(6, ...all);
const y = v => 10 + (1 - (v - lo) / (hi - lo)) * (h - 20);
for(const [F, col] of [[R, cyan], [U, pink]]){
g.strokeStyle = col; g.lineWidth = 2.5; g.lineJoin = 'round'; g.beginPath(); let pen = false;
F.st.forEach((v, i) => { if(v !== v){ pen = false; return; } const x = i / (F.n-1) * w; if(!pen){ g.moveTo(x, y(v - F.med)); pen = true; } else g.lineTo(x, y(v - F.med)); });
g.stroke();
}
}
/* ---------- 혼자 모드 ---------- */
const best = store.get('best', {});
const grid = $('#grid');
function renderGrid(sel){
grid.innerHTML = M.SOUNDS.map(s => `<button class="card" data-id="${s.id}" aria-pressed="${s.id === sel}">
<span class="w">${esc(s.word)}</span><span class="m"><span>${esc(s.name)} · ${'●'.repeat(s.lv)}</span><span class="best">${best[s.id] != null ? best[s.id] : ''}</span></span></button>`).join('');
}
let soloSel = store.get('sel', 'cat');
if(!M.SOUNDS.find(s => s.id === soloSel)) soloSel = 'cat';
const solo = makeStage($('#solo-stage'), {
onResult(res, snd){
if(best[snd.id] == null || res.score > best[snd.id]){ best[snd.id] = res.score; store.set('best', best); if(res.score > 0) toast('최고 기록 갱신!'); }
renderGrid(snd.id);
},
extraButtons(box, res){
const snd = solo.st.snd;
box.innerHTML = `<button class="btn">결과 복사</button><button class="btn ghost">다른 소리</button>`;
box.children[0].onclick = () => copy(`[똑같쥬?] ${snd.name} "${snd.word}" 성대모사 ${res.score}점 (${grade(res.score)[0]})\n${location.href}`);
box.children[1].onclick = pickRandom;
}
});
function selectSolo(id){
soloSel = id; store.set('sel', id);
solo.setSound(M.SOUNDS.find(s => s.id === id)); renderGrid(id);
}
function pickRandom(){
const pool = M.SOUNDS.filter(s => s.id !== soloSel);
selectSolo(pool[Math.floor(Math.random() * pool.length)].id);
$('#solo-stage').scrollIntoView({ behavior:'smooth', block:'start' });
}
grid.onclick = e => { const c = e.target.closest('.card'); if(c && !solo.st.busy) { selectSolo(c.dataset.id); $('#solo-stage').scrollIntoView({ behavior:'smooth', block:'start' }); } };
$('#b-random').onclick = () => { if(!solo.st.busy) pickRandom(); };
selectSolo(soloSel);
/* ---------- 탭 ---------- */
function showTab(t){
$('#tab-solo').setAttribute('aria-selected', t === 'solo'); $('#tab-party').setAttribute('aria-selected', t === 'party');
$('#v-solo').hidden = t !== 'solo'; $('#v-party').hidden = t !== 'party';
}
$('#tab-solo').onclick = () => showTab('solo');
$('#tab-party').onclick = () => showTab('party');
if(location.hash === '#party') showTab('party');
/* ---------- 내기 모드 ---------- */
let names = store.get('players', ['플레이어 1', '플레이어 2']);
let rounds = 5;
const plist = $('#plist');
function renderPlayers(){
plist.innerHTML = names.map((n, i) => `<div class="pin"><input type="text" id="pn-${i}" maxlength="12" value="${esc(n)}" aria-label="참가자 ${i+1}">${names.length > 2 ? `<button class="x" data-i="${i}" aria-label="삭제">×</button>` : ''}</div>`).join('');
$('#b-addp').disabled = names.length >= 8;
}
plist.oninput = e => { const m = e.target.id.match(/pn-(\d+)/); if(m) names[+m[1]] = e.target.value; };
plist.onclick = e => { const b = e.target.closest('.x'); if(b){ names.splice(+b.dataset.i, 1); renderPlayers(); } };
$('#b-addp').onclick = () => { if(names.length < 8){ names.push('플레이어 ' + (names.length + 1)); renderPlayers(); plist.querySelector(`#pn-${names.length-1}`).select(); } };
$('#seg-rounds').onclick = e => { const b = e.target.closest('button'); if(!b) return; rounds = +b.dataset.v; [...$('#seg-rounds').children].forEach(x => x.setAttribute('aria-pressed', x === b)); };
$('#stake').value = store.get('stake', '');
renderPlayers();
let G = null;
const pstage = makeStage($('#party-stage'), {
emptyText: '<strong>한 방 승부</strong>원본은 몇 번이든 들을 수 있지만<br>녹음은 한 번뿐이에요.',
onResult(res){

pstage.setRecDisabled(true);

},
extraButtons(box){
const last = G.turn === G.players.length - 1;

}
});
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function startGame(){

function beginTurn(){

function renderBoard(){

function nextTurn(){
if(G.turn < G.players.length - 1){ G.turn++; beginTurn(); return; }
const snd = G.seq[G.round];
const ranked = G.players.map(p => ({ p, s: p.scores[G.round] })).sort((a, b) => b.s - a.s);

$('#r-rank').innerHTML = ranked.map((r, i) => `<div class="rk"><span class="p">${i+1}</span><span class="nmv">${esc(r.p.name)}<small>${esc(grade(r.s)[0])} · 누적 ${r.p.total}점</small></span><span class="sc">${r.s}점</span></div>`).join('');

}
$('#b-next-round').onclick = () => {

};
function finalRanking(){ return [...G.players].sort((a, b) => b.total - a.total); }
function showFinal(){
const r = finalRanking(), top = r[0], bottom = r[r.length - 1];
const tie = r.filter(p => p.total === top.total).length > 1;
$('#f-title').innerHTML = tie ? `공동 1등: <b>${r.filter(p => p.total === top.total).map(p => esc(p.name)).join(', ')}</b>` : `우승은 <b>${esc(top.name)}</b>!`;
$('#f-stake').innerHTML = G.stake ? `꼴찌 <b>${esc(bottom.name)}</b> 님, 약속 지키셔야죠: ${esc(G.stake)}` : `꼴찌는 <b>${esc(bottom.name)}</b> 님이에요.`;
$('#f-rank').innerHTML = r.map((p, i) => `<div class="rk"><span class="p">${i+1}</span><span class="nmv">${esc(p.name)}<small>평균 ${Math.round(p.total / G.rounds)}점 · ${p.scores.join(' / ')}</small></span><span class="sc">${p.total}점</span></div>`).join('');
$('#p-round').hidden = true; $('#p-game').hidden = true; $('#p-final').hidden = false;
fanfare(95);
}
$('#b-start').onclick = startGame;
$('#b-again').onclick = startGame;
$('#b-reset').onclick = () => { $('#p-final').hidden = true; $('#p-setup').hidden = false; renderPlayers(); };
$('#b-quit').onclick = () => { if(pstage.st.busy) return; $('#p-game').hidden = true; $('#p-setup').hidden = false; renderPlayers(); };
$('#b-copy-final').onclick = () => {
const r = finalRanking();
copy(`[똑같쥬?] 성대모사 내기 결과 (${G.rounds}판)\n` + r.map((p, i) => `${i+1}위 ${p.name} ${p.total}점`).join('\n') + (G.stake ? `\n벌칙: ${r[r.length-1].name} → ${G.stake}` : '') + `\n${location.href.split('#')[0]}#party`);
};
window.__app = { solo, pstage, get G(){ return G; } };
})();
</script>
