<html lang="ko">
<head>
<meta charset="utf-8">

<title>똑같쥬? 성대모사 점수판</title>

<meta property="og:title" content="똑같쥬? 성대모사 점수판">
<meta property="og:description" content="야옹, 삐뽀삐뽀, 꼬끼오… 듣고 따라하면 일치율을 매겨드려요. 친구랑 내기 모드도 있어요.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 노래방 점수 화면 같은 '스크린' 패널 하나가 주인공, 아래로 소리 카드 격자 */
:root{
--bg:#0d0f33; --panel:#171a4d; --panel2:#20246a; --line:#323890;
--fg:#eef0ff; --muted:#9ba1da; --yellow:#ffd23f; --cyan:#41e2d2; --pink:#ff5fa2; --red:#ff6b5b;
--display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);min-height:100vh;
background-image:radial-gradient(900px 500px at 85% -10%,rgba(255,95,162,.16),transparent 60%),radial-gradient(800px 500px at -10% 10%,rgba(65,226,210,.12),transparent 60%);
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1060px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.brand h1{font:400 40px/1 var(--display);margin:0;letter-spacing:.5px}
.brand h1 b{color:var(--yellow);font-weight:400}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:9px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--yellow);color:#1b1640}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* 스테이지 */
.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.stage{grid-template-columns:1fr}}
.screen{position:relative;background:linear-gradient(180deg,#1a1e5c,#12154a);border:2px solid var(--line);border-radius:18px;padding:22px 22px 18px;overflow:hidden;min-height:300px;display:flex;flex-direction:column}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px)}
.screen .top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;letter-spacing:.06em}
.dots{letter-spacing:2px;color:var(--yellow)}
.word{font:400 clamp(44px,9vw,76px)/1.05 var(--display);margin:18px 0 6px;color:var(--fg);text-wrap:balance;text-shadow:0 0 24px rgba(65,226,210,.35)}
.nm{color:var(--cyan);font-weight:600}
.hint{color:var(--muted);margin-top:2px}
.turn{display:inline-block;align-self:flex-start;margin-top:10px;background:var(--pink);color:#2a0a1d;font:400 18px var(--display);padding:4px 12px;border-radius:8px}
.meter{margin-top:auto;padding-top:18px}
.meter .bar{height:10px;border-radius:5px;background:#0b0d2c;border:1px solid var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--yellow),var(--pink));transition:width .06s}
.meter .time{height:3px;margin-top:6px;background:#0b0d2c;border-radius:2px;overflow:hidden}
.meter .time i{display:block;height:100%;width:0;background:var(--yellow)}
.status{margin-top:10px;font-weight:500;min-height:1.5em}
.status.rec{color:var(--pink)}
.count{position:absolute;inset:0;display:grid;place-items:center;font:400 140px var(--display);color:var(--yellow);background:rgba(13,15,51,.72);z-index:2}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-weight:700;font-size:15px;padding:12px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#2a0a1d}
.btn.primary:hover{filter:brightness(1.08)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#1b1640}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
/* 결과 */
.result{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.result .empty{color:var(--muted);margin:auto 0;text-align:center;padding:30px 10px}
.result .empty strong{display:block;font:400 22px var(--display);color:var(--fg);margin-bottom:6px}
.score{display:flex;align-items:baseline;gap:6px}
.score .n{font:400 92px/0.9 var(--display);color:var(--yellow);font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,210,63,.35)}
.score .u{font:400 30px var(--display);color:var(--yellow)}
.grade{font:400 22px var(--display);color:var(--cyan)}
.cmt{color:var(--muted);margin-top:-6px}
.parts{display:grid;gap:8px}
.part{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.part .t{height:8px;background:#0b0d2c;border-radius:4px;overflow:hidden}
.part .t i{display:block;height:100%;background:var(--cyan);border-radius:4px}
.part b{text-align:right;font-variant-numeric:tabular-nums}
canvas.viz{width:100%;height:120px;background:#0b0d2c;border:1px solid var(--line);border-radius:10px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
/* 소리 카드 */
.sect{margin-top:28px}
.sect h2{font:400 22px var(--display);margin:0 0 4px}
.sect .sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:96px}
.card:hover{border-color:var(--cyan)}
.card[aria-pressed="true"]{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow) inset}
.card .w{font:400 22px/1.15 var(--display)}
.card .m{color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:6px;margin-top:auto}
.card .best{color:var(--yellow);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* 내기 모드 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:760px){.setup{grid-template-columns:1fr}}
label.l{display:block;font-weight:700;margin-bottom:8px}
.plist{display:grid;gap:8px}
.pin{display:flex;gap:8px}
input[type=text],select{width:100%;background:#0b0d2c;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:15px var(--body);min-width:0}
.x{flex:none;width:44px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;cursor:pointer;font-size:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#0b0d2c;color:var(--fg);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#06302c;border-color:var(--cyan)}
.note{color:var(--muted);font-size:13px}
.board{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.chip b{color:var(--yellow);font-variant-numeric:tabular-nums}
.chip.now{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ghead .r{font:400 22px var(--display)}
.ghead .r em{font-style:normal;color:var(--muted);font-size:16px}
.rank{display:grid;gap:8px;margin:12px 0 18px}
.rk{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;background:#0b0d2c;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rk .p{font:400 24px var(--display);color:var(--muted)}
.rk:first-child{border-color:var(--yellow)}
.rk:first-child .p{color:var(--yellow)}
.rk .nmv{font-weight:700;min-width:0;overflow-wrap:anywhere}
.rk .nmv small{display:block;color:var(--muted);font-weight:400}
.rk .sc{font:400 24px var(--display);font-variant-numeric:tabular-nums}
.big{font:400 clamp(30px,6vw,46px)/1.15 var(--display);margin:0;text-wrap:balance}
.big b{color:var(--yellow);font-weight:400}
.stake{margin-top:8px;font-size:17px}
.stake b{color:var(--pink)}
footer{margin-top:36px;color:var(--muted);font-size:12.5px;display:grid;gap:4px}
footer a{color:var(--cyan)}
footer summary{cursor:pointer;margin-top:4px}
#credits{display:grid;gap:2px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:#1b1640;font-weight:700;padding:10px 18px;border-radius:999px;z-index:9}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</div>
</div>
